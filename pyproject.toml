[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupaie"
version = "0.1.0"
description = "Gestion des paiements scolaires"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "fpdf2>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edupaie = ["data/migrations/*.sql", "ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["hello_world.py", "test_pyside.py"]  # scripts de démo à la racine

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# QModelIndex() en valeur par défaut : pattern standard des QAbstractTableModel
"src/edupaie/ui/models/*" = ["B008"]
